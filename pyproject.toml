[project]
name = "stock-market-pipeline"
version = "1.0.0"
description = "Stock market ingestion and processing pipeline"
readme = "README.md"
# Pinned to 3.12 to match Databricks serverless environment version 6 (Python 3.12.3), the target
# every job runs on. Developing on a newer interpreter would let syntax and stdlib behaviour through
# that fails on the platform. databricks-connect 19.x also requires exactly 3.12.
requires-python = ">=3.12,<3.13"

# Runtime dependencies of the job code. Ranges, not exact pins: uv.lock fixes exact versions for
# local work, and on serverless the wheel installs on top of the v6 base environment. An exact pin
# above what v6 ships (pandas 2.3.3, pyarrow 21.0.0) would force an in-place upgrade underneath
# Databricks' own Spark/pandas integration.
dependencies = [
    "yfinance>=1.3",
    "pandas>=2.2,<3",
    "pyarrow>=17,<22",
    "lxml>=6.1",
    "requests>=2.32.3",
    "loguru>=0.7.3",
]

[dependency-groups]
# Local Spark for unit tests, matched to serverless v6 (Spark 4.2.0). delta-spark 4.4.1 is the
# first release whose pyspark range admits 4.2.0.
local-spark = [
    "pyspark==4.2.0",
    "delta-spark==4.4.1",
]

# Databricks Connect for integration runs against the workspace. It ships its own `pyspark` module,
# so it can never share an environment with local-spark (declared as a uv conflict below).
dbconnect = [
    "databricks-connect~=19.1",
]

# Docker / Airflow / ClickHouse / Soda stack being replaced by Databricks Jobs, Unity Catalog and
# DQX. Kept installable only so the existing code and its tests keep running while each piece is
# ported; this group is deleted together with airflow/, docker/, soda/ and src/db_init/.
legacy = [
    "apache-airflow==3.2.2",
    "apache-airflow-providers-postgres>=6.7.1",
    "apache-airflow-providers-fab>=3.6.5",
    "apache-airflow-providers-clickhousedb>=1.0.0",
    "psycopg2-binary>=2.9.12",
    "clickhouse-connect>=1.3.0",
    "soda-core-spark>=3.5.6",
    "soda-core-spark-df>=3.5.6",
    "soda-core-mysql>=3.5.6",
    "mysql-connector-python==8.0.29",
    "pyhive>=0.7.0",
    "thrift>=0.23.0",
    "thrift-sasl>=0.4.3",
    "python-dotenv==1.2.2",
    "setuptools>=82.0.1",
]

dev = [
    "mypy>=2.1.0",
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "ruff==0.15.15",
]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "data",
    "spark-warehouse",
    "metastore_db",
]

[tool.ruff.lint]
select = [
    "D",      # pydocstyle (Docstring style checks)
    "E",      # pycodestyle (Style violations/errors)
    "W",      # pycodestyle (Style warnings)
    "F",      # Pyflakes (Core error checks)
    "G",      # flake8-logging-format (Logging formatting)
    "I",      # isort (Import sorting)
    "C90",    # mccabe (Complexity checker)
    "B",      # flake8-bugbear (Common bug prevention)
    "UP",     # pyupgrade (Syntax upgrade to modern Python)
    "N",      # pep8-naming (Naming conventions)
    "S",      # flake8-bandit (Security vulnerability checks)
    "PT",     # flake8-pytest-style (Pytest best practices)
    "ANN",    # flake8-annotations (Type annotations checks)
    "ERA",    # eradicate (Removes commented-out code)
    "PTH",    # flake8-use-pathlib (Pathlib recommendations)
    "RUF",    # Ruff-specific rules
    "SIM",    # flake8-simplify (Simplifying code structure)
    "TCH",    # flake8-type-checking (Type-checking block alignment)
    "PL",     # Pylint (Ruff implementation of Pylint checks)
    "LOG",    # flake8-logging (Standard logging checks)
    "RET",    # flake8-return (Return statement styling)
    "PERF",   # Perflint (Performance checks)
    "PGH",    # pygrep-hooks (Custom checks like raw type: ignore bans)
    "PD",     # pandas-vet (Pandas best practices)
    "T10",    # flake8-debugger (Catches left-over debugger imports)
    "T20",    # flake8-print (Bans print/pprint in production)
    "AIR",    # Ruff Airflow rules (AIR prefix)
]
ignore = [
    "E501",   # Line too long (handled automatically by the formatter)
    "COM812", # Missing trailing comma (conflict with Ruff formatter)
    "ISC001", # Implicit string concatenation (conflict with Ruff formatter)
    "G004",   # Logging statement uses f-string (allows readable f-string logs)
    "D100",   # Missing docstring in public module (module-level header docstrings)
    "D104",   # Missing docstring in public package (empty __init__.py warnings)
    "ANN204", # Missing return type annotation for special method __init__
    "PTH123", # open() should be replaced by Path.open() (allows standard built-in open())
    "PD013",  # pandas-vet stack warning (prefers melt, but stack is appropriate here)
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # assert used (required for standard pytest assertions)
    "S105",    # hardcoded password string (dummy credentials used in mock tests)
    "S106",    # hardcoded password in function call (dummy credentials passed in tests)
    "PT012",   # pytest.raises block should contain a single simple statement
    "ANN",     # type annotations (omitted for tests to reduce verbosity)
    "D",       # docstrings (not strictly required for all test cases)
    "SIM117",  # use a single with statement (prefers nested blocks in some test cases)
    "PLC0415", # import should be at the top-level (inline imports needed for mocking/isolation)
    "PLR2004", # magic value in comparison (common and expected in assert statements)
]
"airflow/dags/**/*.py" = [
    "PLC0415", # import should be at the top-level (to avoid importing PySpark/heavy dependencies on DAG parse time)
    "ANN401",  # dynamically typed expressions (typing.Any) (allowed for context dicts)
]
"src/streaming/gold.py" = [
    "PLC0415", # inline imports are required for PySpark executor tasks serialization
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "ignore:.*copy keyword is deprecated.*",
]

[tool.mypy]
explicit_package_bases = true
ignore_missing_imports = true

[tool.uv]
# `uv sync` installs what CI and local unit tests need. For integration work against the
# workspace: `uv sync --no-default-groups --group dev --group dbconnect`.
default-groups = ["dev", "local-spark", "legacy"]

# databricks-connect and pyspark install the same `pyspark` module. Declaring the conflict lets uv
# resolve both into one lockfile while refusing to install them together; soda-core-spark-df in
# legacy pulls pyspark too.
conflicts = [
    [{ group = "local-spark" }, { group = "dbconnect" }],
    [{ group = "legacy" }, { group = "dbconnect" }],
]

# soda-core-spark-df caps pyspark below the version serverless runs; the override wins until the
# legacy group is removed. mysql-connector-python is held at 8.0.29 for soda-core-mysql.
override-dependencies = [
    "mysql-connector-python==8.0.29",
    "pyspark==4.2.0",
]
